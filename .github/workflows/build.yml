name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable sources and source export
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: make -C frame test all
      - run: python3 frame/tests/test_linux_package.py
      - run: python3 frame/tests/test_desktop.py
      - run: python3 frame/tests/test_fiducial_desktop.py
      - run: python3 frame/tests/test_phone_link.py
      - run: python3 frame/tests/test_photo_reference.py
      - run: python3 frame/tests/test_learned_worker.py
      - run: python3 frame/tests/test_broker.py
      - run: python3 scripts/package-source.py

  native:
    name: Native Linux desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 python3-pip python3-opencv python3-tk python3-pil xvfb xauth file libapriltag-dev libopencv-dev nlohmann-json3-dev clang-format-18 ripgrep
      - name: Check native formatting
        run: rg --files frame/src frame/include frame/tests -g '*.cpp' -g '*.hpp' | xargs clang-format-18 --dry-run --Werror
      - name: Build and test desktop targets
        run: |
          cmake -S frame -B frame/build/ci -DCMAKE_BUILD_TYPE=Release
          cmake --build frame/build/ci --parallel 4
          ctest --test-dir frame/build/ci --output-on-failure
          xvfb-run -a python3 frame/tests/test_phone_gui.py
          xvfb-run -a python3 frame/tests/test_fiducial_gui.py frame/build/ci
          xvfb-run -a python3 frame/tests/test_photo_gui.py frame/build/ci
      - name: Test pretrained static-photo backend
        run: |
          python3 frame/pack/fetch-photo-models.py --output frame/build/models/xfeat --torch-wheel frame/build/photo-wheels
          python3 -m pip install --no-deps --target frame/build/photo-python frame/build/photo-wheels/*.whl -r frame/pack/requirements-photo.txt
          export PYTHONPATH="$PWD/frame/build/photo-python"
          export FRAMEPHONE_PHOTO_MODELS="$PWD/frame/build/models/xfeat"
          frame/build/ci/framephone-photo --model-self-test
          python3 frame/tests/test_learned_photo.py frame/build/ci
          xvfb-run -a python3 frame/tests/test_photo_gui.py frame/build/ci --learned

  linux-package:
    name: Linux package (${{ matrix.arch }}, ${{ matrix.kind }}, ${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            kind: native
            engine: docker
          - runner: ubuntu-24.04-arm
            arch: arm64
            kind: native
            engine: docker
          - runner: ubuntu-24.04-arm
            arch: arm64
            kind: native
            engine: podman
          - runner: ubuntu-24.04
            arch: arm64
            kind: emulated
            engine: docker
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      FRAMEPHONE_CONTAINER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install rootless Podman build tools
        if: matrix.engine == 'podman'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap
      - name: Enable ARM64 emulation on desktop Linux
        if: matrix.kind == 'emulated'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64
      - name: Build and test packaged runtime
        run: bash frame/build.sh --arch ${{ matrix.arch }}
      - name: Run the single executable without a runtime container
        if: matrix.kind == 'native'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          package="$PWD/frame/build/dist/FramePhone-${{ matrix.arch }}.run"
          "$package" -- --self-test
          "$package" -- --camera --help
          "$package" -- --fiducial --help
          "$package" -- --photo --help
          xvfb-run -a "$package" -- --gui-smoke
      - name: Keep tested Linux package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: framephone-linux-${{ matrix.arch }}-${{ matrix.kind }}-${{ matrix.engine }}
          path: |
            frame/build/dist/FramePhone-${{ matrix.arch }}.run
            frame/build/dist/FramePhone-${{ matrix.arch }}.run.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  android:
    name: Android debug, unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify Gradle wrapper
        working-directory: phone/gradle/wrapper
        run: sha256sum --check gradle-wrapper.jar.sha256
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            phone/**/*.gradle.kts
            phone/gradle/libs.versions.toml
            phone/gradle/wrapper/gradle-wrapper.properties
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Build and check
        working-directory: phone
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
