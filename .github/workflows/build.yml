name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable sources and source export
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: make -C frame test all
      - run: python3 scripts/package-source.py

  native:
    name: Native Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 file libapriltag-dev libopencv-dev nlohmann-json3-dev libsdl2-dev clang-format-18 ripgrep
      - name: Check native formatting
        if: matrix.arch == 'x86_64'
        run: rg --files frame/src frame/include frame/tests -g '*.cpp' -g '*.hpp' | xargs clang-format-18 --dry-run --Werror
      - name: Build and test desktop targets
        if: matrix.arch == 'x86_64'
        run: |
          cmake -S frame -B frame/build/ci -DCMAKE_BUILD_TYPE=Release -DFRAMEPHONE_REQUIRE_TRACKER=ON
          cmake --build frame/build/ci --parallel 4
          ctest --test-dir frame/build/ci --output-on-failure
      - name: Build and test ARM64 headset target
        if: matrix.arch == 'aarch64'
        run: bash frame/build-headset.sh

  android:
    name: Android debug, unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify Gradle wrapper
        working-directory: phone/gradle/wrapper
        run: sha256sum --check gradle-wrapper.jar.sha256
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            phone/**/*.gradle.kts
            phone/gradle/libs.versions.toml
            phone/gradle/wrapper/gradle-wrapper.properties
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Build and check
        working-directory: phone
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
