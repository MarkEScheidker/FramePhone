name: Bug report
description: Report a reproducible build, phone or tracking problem.
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Android companion
        - Native build or diagnostic
        - Stereo tracking or headset integration
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
      description: Include commands/settings, what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, OS/architecture, dependency versions, phone model/Android version, and synthetic/replay/live input as applicable.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or measurements
      description: Include relevant errors and tracking conditions. Remove credentials and unrelated camera content before sharing samples.
